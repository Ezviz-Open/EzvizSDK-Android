apply plugin: 'com.android.application'
apply from: "../app-common/build_common.gradle"
apply plugin: 'kotlin-android'

//如果有用到kapt添加如下配置
kapt {
    useBuildCache = true
    javacOptions {
        option("-Xmaxerrs", 500)
    }
}

android {
    compileSdkVersion rootProject.ext.compileVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    lintOptions {
        abortOnError false
    }
    defaultConfig {
        applicationId "ezviz.ezopensdk"
        namespace 'ezviz.ezopensdk'
        minSdkVersion rootProject.ext.minSdk
        targetSdkVersion rootProject.ext.targetSdk
        versionCode 5270
        versionName "v5.27"
        multiDexEnabled false
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        myConfig {
            storeFile file("test.jks")
            storePassword "abcd1234"
            keyAlias "key0"
            keyPassword "abcd1234"
            v2SigningEnabled true
            v1SigningEnabled true //gradle升级到5.4.1之后，取值会默认为false。此时打出的包无法在Android7.0以下机型安装
        }
    }

    //在Android代码块中添加如下配置：（可优化最上图中transformClassDexBuilderForDebug的时间）
    dexOptions {
        preDexLibraries true
        maxProcessCount 8
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.myConfig //签名
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.myConfig //签名
        }
    }
    buildFeatures{
        viewBinding true
        buildConfig true
    }
    productFlavors {
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}
kotlin {
    jvmToolchain(8)
}

dependencies {
    /*萤石SDK核心模块，必须*/
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'io.github.ezviz-open:ezviz-sdk:5.27'
    // 4.19.0版本之后需要自行依赖okhttp和gson库
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation "com.google.code.gson:gson:$gsonVersion"

    /*demo的依赖项*/
    implementation project(path: ':app-common')
    implementation project(path: ':bandwidthcheck')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.3.0-alpha02'
    implementation 'com.github.bingoogolapple.BGAQRCode-Android:zxing:1.3.8'
    implementation 'com.github.shangmengmeng:IndicatorSeekBar:v2.1.1.2'

    /*蓝牙设备配网的依赖项*/
    implementation files('libs/eziot-ble-release.aar')
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    api 'androidx.core:core-ktx:1.3.2'
    api 'com.squareup.retrofit2:retrofit:2.4.0'
    api 'com.squareup.retrofit2:converter-gson:2.4.0'
}

