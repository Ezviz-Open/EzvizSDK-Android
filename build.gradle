buildscript {

    //依赖版本统一管理
    ext.kotlin_version = '2.0.21'
    ext.arrouter_api_version = '1.4.0'
    ext.arouter_compiler_version = '1.2.1'

    ext.minSdk = 21
    ext.targetSdk = 35
    ext.compileVersion = 35
    ext.buildToolsVersion = "35.0.0"

    ext.gsonVersion = '2.8.5'

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
